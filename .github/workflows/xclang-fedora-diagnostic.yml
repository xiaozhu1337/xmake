name: xclang-fedora-diagnostic
# Temporary fork-only comparison of the PR and its unchanged base.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            ref: e01ff22a90ea5cac67f53620bbb0981542bd30d8
          - name: head
            ref: 28a866eb33b7e998b7a03766c5c21c192518929f
    env:
      XMAKE_ROOT: y
      XMAKE_STATS: false
    steps:
      # Match the upstream Fedora workflow's host dependencies.
      - name: Prepare build tools
        run: |
          dnf -y install @development-tools @rpm-development-tools
          dnf -y install mesa-libGL-devel mesa-libGLU-devel
          dnf -y install copr-cli make gcc-c++ perl
          dnf -y upgrade git
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - name: Prepare local xmake
        run: python3 -c 'import shutil; shutil.copytree(".", "../xmake-source", dirs_exist_ok=True)'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: local#../xmake-source
      # Keep all three tests in one process and expose child configuration traces.
      - name: Diagnose original test sequence
        continue-on-error: true
        shell: python3 {0}
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          real = shutil.which('xmake')
          wrapper = Path('__tmp/ci-trace/xmake').resolve()
          wrapper.parent.mkdir(parents=True, exist_ok=True)
          wrapper.write_text(chr(10).join([
              '#!/usr/bin/python3',
              'import subprocess, sys',
              f'real = {real!r}',
              'args = sys.argv[1:]',
              "if args and args[0] == '-y':",
              "    args = ['-vD', *args]",
              'raise SystemExit(subprocess.run([real, *args]).returncode)',
              '']), encoding='utf-8')
          wrapper.chmod(0o755)
          script = Path('__tmp/trace-sequence.lua')
          script.write_text(chr(10).join([
              'function main()',
              '    import("run", {rootdir = path.join(os.scriptdir(), "..", "tests")})',
              '    run("actions/addon")',
              '    run("actions/package/localpkg")',
              '    run("actions/install")',
              'end', '']), encoding='utf-8')
          env = os.environ.copy()
          env['PATH'] = str(wrapper.parent) + os.pathsep + env['PATH']
          try:
              code = subprocess.run([real, 'lua', '-v', '-D', str(script)], env=env).returncode
          finally:
              wrapper.unlink()
              script.unlink()
          raise SystemExit(code)
      - name: Xclang discovery regression
        if: always() && matrix.name == 'head'
        run: xmake lua -v -D tests/run.lua toolchains/xclang

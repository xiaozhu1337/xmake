name: xclang-fedora-diagnostic
# Temporary fork-only verification of the exact PR commit in detached HEAD mode.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head
            ref: 28a866eb33b7e998b7a03766c5c21c192518929f
    env:
      XMAKE_ROOT: y
      XMAKE_STATS: false
    steps:
      # Match the upstream Fedora workflow's host dependencies.
      - name: Prepare build tools
        run: |
          dnf -y install @development-tools @rpm-development-tools
          dnf -y install mesa-libGL-devel mesa-libGLU-devel
          dnf -y install copr-cli make gcc-c++ perl
          dnf -y upgrade git
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - name: Prepare local xmake
        run: python3 -c 'import shutil; shutil.copytree(".", "../xmake-source", dirs_exist_ok=True)'
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: local#../xmake-source
      - name: Full Fedora test suite
        run: |
          xmake lua -v -D tests/run.lua
          xrepo --version
